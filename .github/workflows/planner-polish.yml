name: Planner polish and browser pointer tests
on:
  push:
    branches: [feat/planner-polish, feat/planner-ui-a-header, feat/planner-ui-b-board, feat/planner-ui-c-drawer, feat/planner-phase-5d, feat/planner-phase-5e, feat/planner-phase-5f, feat/planner-phase-5g, feat/planner-phase-6a]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Playwright for real Chromium
        run: |
          npm install --prefix .e2e --no-save --no-package-lock playwright@1.56.1
          .e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Pointer drag, persistence, undo, mobile agenda
        run: |
          pnpm dev --host 127.0.0.1 --port 4173 > /tmp/planner-vite.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/e2e/schedule-pointer.mjs
          node tests/e2e/phase5-quick-add.mjs
          node tests/e2e/phase5d-ui.mjs
          node tests/e2e/phase5e-ui.mjs
          node tests/e2e/phase5f-portals.mjs
          node tests/e2e/phase5g-keyboard.mjs
          node tests/e2e/phase6a-ui.mjs
          node tests/e2e/grid-airy.mjs
          node tests/e2e/phase6b-ui.mjs
          node tests/e2e/phase6c-ui.mjs
          node tests/e2e/phase6d-ui.mjs
          node tests/e2e/phase7a-timeline.mjs
      - name: Capture before and after Grid screenshots (1280/375, light/dark)
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/grid-artifacts/before /tmp/grid-artifacts/after
          SCREENSHOT_OUTPUT=/tmp/grid-artifacts/after node tests/e2e/grid-airy.mjs
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach /tmp/grid-before FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/grid-before/node_modules
          (cd /tmp/grid-before && node_modules/.bin/vite --host 127.0.0.1 --port 4174 > /tmp/grid-before.log 2>&1) &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          SCREENSHOT_BASE_URL=http://127.0.0.1:4174 SCREENSHOT_OUTPUT=/tmp/grid-artifacts/before node tests/e2e/grid-airy.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: grid-airy-before-after
          path: /tmp/grid-artifacts/
      - name: Capture Phase 6B before and after (1280/375, light/dark)
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/dependencies-artifacts/before /tmp/dependencies-artifacts/after
          SCREENSHOT_OUTPUT=/tmp/dependencies-artifacts/after node tests/e2e/phase6b-ui.mjs
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach /tmp/dependencies-before FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/dependencies-before/node_modules
          (cd /tmp/dependencies-before && node_modules/.bin/vite --host 127.0.0.1 --port 4175 > /tmp/dependencies-before.log 2>&1) &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          SCREENSHOT_BASE_URL=http://127.0.0.1:4175 SCREENSHOT_OUTPUT=/tmp/dependencies-artifacts/before node tests/e2e/phase6b-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: phase6b-dependencies-before-after
          path: /tmp/dependencies-artifacts/
      - name: Capture Phase 6C hierarchy dialogs 1280/375 Light/Dark
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/tree-captures/before /tmp/tree-captures/after
          SCREENSHOT_OUTPUT=/tmp/tree-captures/after node tests/e2e/phase6c-ui.mjs
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach /tmp/tree-before FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/tree-before/node_modules
          (cd /tmp/tree-before && node_modules/.bin/vite --host 127.0.0.1 --port 4176 > /tmp/tree-before.log 2>&1) &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4176/ > /dev/null; then break; fi
            sleep 1
          done
          SCREENSHOT_BASE_URL=http://127.0.0.1:4176 SCREENSHOT_OUTPUT=/tmp/tree-captures/before node tests/e2e/phase6c-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: phase6c-hierarchy-before-after
          path: /tmp/tree-captures/
      - name: Capture Phase 6D Board and drawer 1280/375 Light/Dark
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/phase6d-captures/before /tmp/phase6d-captures/after
          SCREENSHOT_OUTPUT=/tmp/phase6d-captures/after node tests/e2e/phase6d-ui.mjs
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach /tmp/phase6d-before FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/phase6d-before/node_modules
          (cd /tmp/phase6d-before && node_modules/.bin/vite --host 127.0.0.1 --port 4177 > /tmp/phase6d-before.log 2>&1) &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4177/ > /dev/null; then break; fi
            sleep 1
          done
          SCREENSHOT_BASE_URL=http://127.0.0.1:4177 SCREENSHOT_OUTPUT=/tmp/phase6d-captures/before node tests/e2e/phase6d-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: phase6d-board-drawer-before-after
          path: /tmp/phase6d-captures/
      - name: Capture Phase 7A Timeline and Grid mobile 1280/375 Light/Dark
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/phase7a-captures/before /tmp/phase7a-captures/after
          SCREENSHOT_OUTPUT=/tmp/phase7a-captures/after node tests/e2e/phase7a-timeline.mjs
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach /tmp/phase7a-before FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/phase7a-before/node_modules
          (cd /tmp/phase7a-before && node_modules/.bin/vite --host 127.0.0.1 --port 4178 > /tmp/phase7a-before.log 2>&1) &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4178/ > /dev/null; then break; fi
            sleep 1
          done
          SCREENSHOT_BASE_URL=http://127.0.0.1:4178 SCREENSHOT_OUTPUT=/tmp/phase7a-captures/before node tests/e2e/phase7a-timeline.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: phase7a-timeline-before-after
          path: /tmp/phase7a-captures/
