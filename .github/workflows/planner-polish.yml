name: Planner polish and browser pointer tests
on:
  push:
    branches: [feat/planner-polish]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Playwright for real Chromium
        run: |
          npm install --prefix .e2e --no-save --no-package-lock playwright@1.56.1
          .e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Pointer drag, persistence, undo, mobile agenda
        run: |
          pnpm dev --host 127.0.0.1 --port 4173 > /tmp/planner-vite.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/e2e/schedule-pointer.mjs
