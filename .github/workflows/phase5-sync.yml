name: Sync Phase 5 stacked branch
on:
  push:
    branches: [feat/planner-ui-b-board]
    paths: [.github/workflows/phase5-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/planner-ui-b-board
          fetch-depth: 0
      - name: Integrate current Phase A branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/planner-ui-a-header
          git merge --no-edit -X ours origin/feat/planner-ui-a-header
          git restore --source=origin/feat/planner-ui-a-header -- docs/phase5/header
          git add docs/phase5/header
          git diff --cached --quiet || git commit -m "docs: align inherited Phase A screenshots [skip ci]"
          git push origin HEAD:feat/planner-ui-b-board
