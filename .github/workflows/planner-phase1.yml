name: Planner typecheck and tests
on:
  push:
    branches: [feat/planner-phase-1, feat/planner-phase-2]
  pull_request:
    branches: [main, feat/planner-phase-1]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
